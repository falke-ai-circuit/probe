# PROBE — Platform for Remote Operations & Bridge Environment
#
# Deploy (host pulls, it does not build):  docker compose up -d
# Bring-up that reports what it is:        ./scripts/bringup.sh
#
# IMAGE PIN — do not change this to a floating tag.
#   ghcr.io/falke-ai-circuit/probe:70de7fa03f879e0cdc48dc9048a5d25c69121211
#   @sha256:466b2fc23e3349ba136a0a34867b44b48d24d9bd08ea7121fe324e24765d5504
# The tag is the commit the image was built from (70de7fa, "release: bump Semver
# 1.19.0 -> 1.19.1"), the digest is the manifest digest that image resolved to on
# the host that runs this stack. `image:` carries both, so a re-tag on the
# registry cannot silently change what a deploy gets. There is deliberately no
# `build:` key: the image is published by .github/workflows/docker.yml, and a
# compose file that can build would let the runtime /src drift from the tag.
# To build a local image for testing, use a distinct name and never push it under
# this reference:  docker build -t probe:local-$(git rev-parse --short HEAD) .
#
# PERSISTENT DATA (survives container recreation):
#   /data/runtime          agent registry, enrollment DB, operator DB, CA, flows,
#                          builder DB and the managed build artifacts
#   /data/logs             audit log
# Both are bind mounts with production defaults; override the host side with
# PROBE_RUNTIME_DIR / PROBE_LOG_DIR without editing this file.
#
# Security defaults:
#   - Admin password: f4lk3.PROBE (change via PROBE_ADMIN_PASSWORD env)
#   - WebUI/API restricted to Tailscale range (100.64.0.0/10)
#   - API auth required (--require-api-auth)
#   - Login rate limiting: 5 failed attempts / 5 min → 15-min lockout
#   - Login audit logging to /data/logs/audit.jsonl
#   - IP blacklist configurable via PROBE_BLACKLIST_CIDR env
#   - /ws WebSocket endpoint open from any IP (agents connect from anywhere)

services:
  probe:
    image: ghcr.io/falke-ai-circuit/probe:70de7fa03f879e0cdc48dc9048a5d25c69121211@sha256:466b2fc23e3349ba136a0a34867b44b48d24d9bd08ea7121fe324e24765d5504
    container_name: falke-probe
    restart: unless-stopped
    ports:
      - "7701:7701"
    volumes:
      - ${PROBE_RUNTIME_DIR:-/docker/agent-core/data/workspace-operative/probe/runtime}:/data/runtime
      - ${PROBE_LOG_DIR:-/docker/agent-core/data/logs/falke/probe}:/data/logs
      - probe-data:/data
    environment:
      - PROBE_ADMIN_PASSWORD=f4lk3.PROBE
      - PROBE_BLACKLIST_CIDR=${PROBE_BLACKLIST_CIDR:-}
      - PROBE_VT_API_KEY=${PROBE_VT_API_KEY:-}
    command:
      - serve
      - --addr
      - 0.0.0.0:7701
      - --token
      - falke-admin-2026
      - --admin-password
      - ${PROBE_ADMIN_PASSWORD:-f4lk3.PROBE}
      - --allowed-cidr
      - 100.64.0.0/10,10.10.10.0/24,172.16.0.0/12
      - --require-api-auth
      - --token-ttl
      - "0"
      - --registry
      - /data/runtime/registry.json
      - --operator-db
      - /data/runtime/operators.json
      - --enrollment-db
      - /data/runtime/enrollment.json
      - --builder-db
      - /data/runtime/builds.json
      - --builder-output-dir
      - /data/runtime/builds
      - --builder-go
      - /usr/local/go/bin/go
      - --builder-source
      - /src/cmd/probe-client/
      - --profiles-db
      - /data/runtime/profiles.json
      - --ca-dir
      - /data/runtime/ca
      - --audit-log
      - /data/logs/audit.jsonl
      - --flows-path
      - /data/runtime/flows.json
      - --blacklist-cidr
      - ${PROBE_BLACKLIST_CIDR:-}
    healthcheck:
      # /api/v1/health is the unauthenticated version+count surface. Do not use
      # /api/v1/agents here: it requires a token and returns 401, which marks a
      # healthy server unhealthy (measured: 401 without auth, 200 on health).
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:7701/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  probe-data:
    driver: local
