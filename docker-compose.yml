# PROBE — Platform for Remote Operations & Bridge Environment
#
# Deploy (host pulls, it does not build):  docker compose up -d
# Bring-up that reports what it is:        ./scripts/bringup.sh
#
# IMAGE PIN — do not change this to a floating tag. BUMP RULE: when a deploy
# moves the image, move this pin in the SAME change as the deploy. Verify the
# new digest with `docker inspect <image> --format '{{json .RepoDigests}}'` on
# THE HOST THAT PULLED IT (the host that runs the stack) and paste the line as
# tag@digest here; never pin a digest you have not seen in that output.
#   ghcr.io/falke-ai-circuit/probe:62a3b8e68d983713626b3c0ecc0992fcebd37529
#   @sha256:df0cac38ae1bafa92be9ec0cacabee2be643be304e8d0da0edcb1e5b05fe1c26
# The tag is the commit the image was built from (62a3b8e), the digest below is
# what that tag resolves to, verified against the RepoDigests reported by the
# production host (CT100, /docker/operator-op01 — the checkpoint this repo may
# legitimately trail).
# `image:` carries both, so a re-tag on the registry cannot silently change what
# a deploy gets. There is deliberately no `build:` key: the image is published by
# .github/workflows/docker.yml, and a compose file that can build would let the
# runtime /src drift from the tag.
# To build a local image for testing, use a distinct name and never push it under
# this reference:  docker build -t probe:local-$(git rev-parse --short HEAD) .
#
# PERSISTENT DATA (survives container recreation):
#   /data/runtime          agent registry, enrollment DB, operator DB, CA, flows,
#                          builder DB and the managed build artifacts
#   /data/logs             audit log
# Both are bind mounts with production defaults; override the host side with
# PROBE_RUNTIME_DIR / PROBE_LOG_DIR without editing this file.
#
# Security defaults:
#   - Admin password: f4lk3.PROBE (change via PROBE_ADMIN_PASSWORD env)
#   - WebUI/API restricted to Tailscale range (100.64.0.0/10)
#   - API auth required (--require-api-auth)
#   - Login rate limiting: 5 failed attempts / 5 min → 15-min lockout
#   - Login audit logging to /data/logs/audit.jsonl
#   - IP blacklist configurable via PROBE_BLACKLIST_CIDR env
#   - /ws WebSocket endpoint open from any IP (agents connect from anywhere)
#
# DEPLOY-TIME DIVERGENCES — live on CT100 but deliberately NOT mirrored here:
#   1. container_name: live runs as operator-op01-probe-1; this repo keeps
#      falke-probe. Renaming here would orphan the live container on the next
#      `compose up`; the live name is a deployment choice (P11-03 deferral).
#   2. Networks: live attaches the service to an external `falke-net` (with the
#      `probe` alias) plus a project bridge `operator-net`. The repo file stays
#      network-neutral; attaching external networks is a per-deployment edit —
#      mirroring them here would break stacks without that network.
#   3. Healthcheck: live uses a bash /dev/tcp probe because the pinned image
#      ships no curl/wget/nc/busybox, so this file's curl test cannot run. The
#      repo keeps curl (the bring-up.sh proof path documents the measurement);
#      a deployment that uses this pinned image must apply the /dev/tcp variant
#      or install a fetch tool in the image.

services:
  probe:
    image: ghcr.io/falke-ai-circuit/probe:62a3b8e68d983713626b3c0ecc0992fcebd37529@sha256:df0cac38ae1bafa92be9ec0cacabee2be643be304e8d0da0edcb1e5b05fe1c26
    container_name: falke-probe
    restart: unless-stopped
    ports:
      - "7701:7701"
    volumes:
      - ${PROBE_RUNTIME_DIR:-/docker/agent-core/data/workspace-operative/probe/runtime}:/data/runtime
      - ${PROBE_LOG_DIR:-/docker/agent-core/data/logs/falke/probe}:/data/logs
      - probe-data:/data
    environment:
      - PROBE_ADMIN_PASSWORD=f4lk3.PROBE
      - PROBE_BLACKLIST_CIDR=${PROBE_BLACKLIST_CIDR:-}
      - PROBE_VT_API_KEY=${PROBE_VT_API_KEY:-}
    command:
      - serve
      - --addr
      - 0.0.0.0:7701
      - --token
      - falke-admin-2026
      - --admin-password
      - ${PROBE_ADMIN_PASSWORD:-f4lk3.PROBE}
      - --allowed-cidr
      - 100.64.0.0/10,10.10.10.0/24,172.16.0.0/12
      - --require-api-auth
      # P19-04: rotation runs at its 24h default (the flag below restores the
      # explicit value the compose file previously zeroed). The P19-01 guard
      # stays: --token-ttl=0 still requires --allow-disabled-token-ttl, so an
      # operator who wants rotation OFF must say so visibly.
      - --token-ttl
      - "24h"
      - --registry
      - /data/runtime/registry.json
      - --operator-db
      - /data/runtime/operators.json
      - --enrollment-db
      - /data/runtime/enrollment.json
      - --builder-db
      - /data/runtime/builds.json
      - --builder-output-dir
      - /data/runtime/builds
      - --builder-go
      - /usr/local/go/bin/go
      - --builder-source
      - /src/cmd/probe-client/
      - --profiles-db
      - /data/runtime/profiles.json
      - --ca-dir
      - /data/runtime/ca
      - --audit-log
      - /data/logs/audit.jsonl
      - --flows-path
      - /data/runtime/flows.json
      - --blacklist-cidr
      - ${PROBE_BLACKLIST_CIDR:-}
    healthcheck:
      # /api/v1/health is the unauthenticated version+count surface. Do not use
      # /api/v1/agents here: it requires a token and returns 401, which marks a
      # healthy server unhealthy (measured: 401 without auth, 200 on health).
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:7701/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  probe-data:
    driver: local
