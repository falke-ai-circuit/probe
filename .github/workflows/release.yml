name: Release

on:
  push:
    tags:
      - 'v*'

# Minimal scope: the default GITHUB_TOKEN is contents read-only, so
# `goreleaser release` publishing the GitHub release 403s
# ("Resource not accessible by integration", run 45841508038).
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
