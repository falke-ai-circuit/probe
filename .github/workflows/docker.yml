name: Docker Image

# Builds the PROBE service image in CI and pushes it to GHCR.
# The host never builds: it pulls the published image (see docker-compose.yml,
# P8-14 part b) so /src inside the runtime can never lag the repo again.

# Deployable refs — what a build from each means (do not infer from YAML):
#   - push to `main`       → production image; the host may run it as-is.
#   - push to `r119-build` → candidate image from the working branch; same
#     pipeline, same immutable sha tag. A deploy must verify the image digest
#     and org.opencontainers.image.revision == the pushed sha before swapping
#     the stack.
#   - push of a `v*` tag   → release image; additionally carries the semver tag
#     from internal/version/version.go.
#   - workflow_dispatch    → manual rebuild of any ref above.
# Every build gets an immutable sha tag (type=sha,format=long); `latest` is
# never pushed (flavor: latest=false), on branch builds included.
on:
  push:
    branches: [main, r119-build]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/falke-ai-circuit/probe

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read app version (internal/version)
        id: appver
        # The image is labelled from the app's own Semver, not from the tag: a
        # sha tag carries no version and a v* tag can disagree with the source.
        # One read, one value, stamped into ldflags and the OCI label alike.
        run: |
          set -euo pipefail
          v=$(sed -n 's/^var Semver = "\([^"]*\)"$/\1/p' internal/version/version.go)
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::no Semver parsed from internal/version/version.go (got '$v')"
            exit 1
          fi
          echo "semver=$v" >> "$GITHUB_OUTPUT"
          echo "app Semver: $v"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are explicit: the commit sha always, release version + pushed tag
      # name on a v* tag. Never :latest - deploys pin an immutable tag.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=ref,event=tag

      # P24-01 §8 release guards — MUST pass before any push step runs.
      # Guard A: the freshly built image's org.opencontainers.image.version
      #   must equal internal/version/version.go's Semver at this sha, so a
      #   label can never disagree with the version source (the 62a3b8e /
      #   e46023f "two builds under one version string" collision dies here).
      # Guard B: the built sha must carry a v<semver> tag resolving to exactly
      #   that commit, and on a v* tag push the pushed ref must BE that tag —
      #   the "image without a release identity" failure mode (18 tags, newest
      #   v1.15.0-fud; 1.19.0/1.19.1 never tagged) is refused pre-push.
      # scripts/check-release-guards.sh exits 1 on any refusal; the guards are
      # ADDITIVE — the trigger shape (branches [main, r119-build], tags v*,
      # workflow_dispatch) from P15-14 is unchanged.
      - name: Guard A — version label equals version source (build, pre-push)
        run: |
          set -euo pipefail
          docker build -q -t "$IMAGE:guards-probe" --build-arg GIT_SHA="${{ github.sha }}" --build-arg VERSION="${{ steps.appver.outputs.semver }}" .
          IMAGE="$IMAGE:guards-probe" REVISION="${{ github.sha }}" scripts/check-release-guards.sh "$IMAGE:guards-probe" "${{ github.sha }}"

      - name: Guard B — revision sha carries the release tag (pre-push)
        run: |
          set -euo pipefail
          git fetch --tags --force
          REVISION="${{ github.sha }}" scripts/check-release-guards.sh "$IMAGE:guards-probe" "${{ github.sha }}"

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Both architectures in one build => one manifest list at one tag, so
          # an amd64 host and an arm64 Radxa pull the same reference. The
          # Dockerfile's every stage is a multi-arch base image, so no other
          # change is needed for the second platform.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.appver.outputs.semver }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.appver.outputs.semver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image digest
        run: |
          {
            echo "### PROBE image"
            echo ""
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- app version: \`${{ steps.appver.outputs.semver }}\` (from internal/version/version.go)"
            echo "- platforms: linux/amd64, linux/arm64 (single manifest list)"
            echo "- source commit: \`${{ github.sha }}\`"
            echo "- tags:"
            printf '%s\n' '${{ steps.meta.outputs.tags }}' | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"
